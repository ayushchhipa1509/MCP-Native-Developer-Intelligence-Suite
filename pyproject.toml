[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-developer-intelligence-suite"
version = "0.1.0"
description = "An autonomous multi-agent system built on MCP to bridge LLMs and local development environments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ayush Chhipa" }]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
mcp-dev-intel = "mcp_server.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100
